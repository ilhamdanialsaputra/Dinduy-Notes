name: Build Dinduy APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Keystore (opsional)
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/dinduy.jks"
            echo "KS_FILE=$RUNNER_TEMP/dinduy.jks" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
          KS_ALIAS: ${{ secrets.KS_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon 2>&1 | tee build.log

      - name: Tampilkan error saja
        if: failure()
        run: |
          grep '^e: ' build.log | sed 's#file:///home/runner/work/[^/]*/[^/]*/##' || true

      - uses: actions/upload-artifact@v4
        with:
          name: Dinduy-apk
          path: app/build/outputs/apk/release/*.apk
